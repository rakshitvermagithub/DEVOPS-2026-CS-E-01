services:
  - type: web
    name: devops-url-shortener-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://devops-url-shortener-frontend.onrender.com
      - key: APP_URL
        value: https://devops-url-shortener-backend.onrender.com/

  - type: web
    name: devops-url-shortener-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://devops-url-shortener-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
